<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .header {
      padding: 30px 20px 20px;
      font-size: 26px;
      font-weight: bold;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 25px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 20px;
    }

    button {
      padding: 18px 10px;
      border: none;
      border-radius: 15px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    button:active {
      transform: scale(0.96);
    }
  </style>
</head>

<body>

  <div class="header">
    🛡️ ADMIN PANEL
  </div>

  <div class="subtitle">
    𝐆𝐔𝐑𝐔𝐇 𝐁𝐎𝐒𝐇𝐐𝐀𝐑𝐔𝐕𝐈
  </div>

  <div class="buttons">
    <button>🔨 BAN</button>
    <button>🔇 MUTE</button>
    <button>⚠️ WARN</button>
    <button>📊 STATISTIKA</button>
    <button>👥 A'ZOLAR</button>
    <button>⚙️ SOZLAMALAR</button>
  </div>

</body>
</html>
